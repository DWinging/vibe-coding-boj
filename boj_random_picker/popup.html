<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>BOJ Random Picker</title>
  <link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/>
        <g fill="currentColor"><circle cx="8" cy="8" r="1.3"/><circle cx="16" cy="8" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="8" cy="16" r="1.3"/><circle cx="16" cy="16" r="1.3"/></g>
      </svg>
      <h1>BOJ Random Picker</h1>
    </div>
    <button id="settingsBtn" class="icon-button" aria-label="알고리즘 프리셋 설정" title="알고리즘 프리셋 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path d="m9 3-.6 2.2-1.7 1L4.5 6 3 8.6l1.6 1.6v2L3 14l1.5 2.6 2.2-.3 1.7 1L9 20h3l.6-2.7 1.7-1 2.2.3L18 14l-1.6-1.8v-2L18 8.6 16.5 6l-2.2.2-1.7-1L12 3Z" transform="translate(1.5 .5)"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
  </header>

  <main id="mainView" class="view">
    <section class="account-area" aria-label="solved.ac 계정">
      <div class="account-identity">
        <span id="accountText"></span>
        <span id="connectionStatus" class="connection-status" role="status">미연결</span>
      </div>
      <button id="connectBtn" class="account-button" aria-haspopup="dialog" aria-controls="connectionDialog">계정 연결</button>
      <button id="disconnectBtn" class="account-button" hidden>연결 해제</button>
    </section>

    <section class="tier-controls" aria-labelledby="tierHeading">
      <div class="section-heading">
        <h2 id="tierHeading">난이도 범위</h2>
        <span id="tierText" class="tier-value">P5 - P3</span>
      </div>
      <div id="tierSlider" class="multi-range-container">
        <div class="slider-track" aria-hidden="true"><div class="slider-selection"></div></div>
        <input type="range" id="minTier" aria-label="최소 난이도" min="1" max="30" value="16" class="dual-input">
        <input type="range" id="maxTier" aria-label="최대 난이도" min="1" max="30" value="18" class="dual-input">
      </div>
    </section>

    <section class="setting-item">
      <label for="presetSelect">알고리즘 프리셋</label>
      <select id="presetSelect">
        <option value="">전체 알고리즘</option>
      </select>
      <details class="privacy-notice privacy-details">
        <summary>개인정보 안내</summary>
        <p>문제 뽑기를 누르면 검색 조건을 Cloudflare Worker를 거쳐 solved.ac로 전송합니다.
          <a href="https://github.com/DWinging/vibe-coding-boj/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>
        </p>
      </details>
    </section>

    <button id="drawBtn" class="btn-main">문제 뽑기</button>
  </main>

  <p id="statusText" role="status" aria-live="polite"></p>
  <dialog id="connectionDialog" aria-labelledby="connectionHeading" aria-describedby="connectionNotice sessionNotice">
    <h2 id="connectionHeading">solved.ac 계정 연결</h2>
    <p id="connectionNotice">계정 ID를 확인해 푼 문제를 제외합니다. 인증 코드·토큰·계정 ID는 Cloudflare Worker를 거쳐 solved.ac와 주고받습니다.</p>
    <p id="sessionNotice" class="privacy-notice">브라우저를 재시작하면 다시 연결해야 합니다. 연결 없이도 추천할 수 있습니다.</p>
    <a class="privacy-link" href="https://github.com/DWinging/vibe-coding-boj/blob/main/PRIVACY.md" target="_blank" rel="noopener noreferrer">개인정보처리방침</a>
    <div class="dialog-actions">
      <button id="cancelConnectBtn" class="dialog-cancel" autofocus>취소</button>
      <button id="confirmConnectBtn" class="btn-main">동의하고 연결</button>
    </div>
  </dialog>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
