name: Daily BOJ Recommendation

on:
  schedule:
    # 한국 시간(KST) 오전 9시 (UTC 00:00), 월~금요일(1~5) 평일에만 실행
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Mattermost Message
        env:
          # GitHub Secrets에 등록한 웹훅 주소를 불러옴
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: node alarm_bot/scripts/send-message.js