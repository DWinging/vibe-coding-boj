name: Daily BOJ Recommendation

on:
  schedule:
    # 한국 시간(KST) 08:40은 UTC 기준으로 전날 23:40입니다.
    # 월~금 아침 배달을 위해 UTC 기준 일~목(0-4)로 설정합니다.
    - cron: '40 23 * * 0-4'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Mattermost Message
        env:
          # GitHub Secrets에 등록한 웹훅 주소를 불러옴
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: node alarm_bot/scripts/send-message.js