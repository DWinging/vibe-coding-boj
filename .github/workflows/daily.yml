name: Daily BOJ Recommendation

on:
  schedule:
    # 한국 시간(KST) 오전 9시는 UTC 기준으로 00:00입니다.
    - cron: '5 15 * * *'
  workflow_dispatch: # 필요할 때 수동으로 실행 버튼 누를 수 있게 함

jobs:
  send_message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Send Mattermost Message
        env:
          # GitHub Secrets에 등록한 웹훅 주소를 불러옴
          MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: node scripts/send-message.js